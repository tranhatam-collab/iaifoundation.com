name: CD - API Containment

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY CONTAINMENT to update the fail-closed API Worker
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: iaifoundation-api-containment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy fail-closed API
    if: github.event.inputs.confirm == 'DEPLOY CONTAINMENT'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependency advisories
        run: npm audit --audit-level=high

      - name: Run API release gate
        run: npm run check:api

      - name: Require Cloudflare production credential
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::production environment secret CLOUDFLARE_API_TOKEN is not configured"
            exit 1
          fi

      - name: Deploy containment Worker
        run: wrangler deploy --config apps/api/wrangler.toml

      - name: Verify containment boundary
        run: npm run smoke:api
